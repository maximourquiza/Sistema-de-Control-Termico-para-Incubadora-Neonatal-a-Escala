<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control térmico · Maqueta</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">LPC1769 / HC-05</p><h1>Control térmico</h1></div></header>
    <section class="connection" aria-label="Conexión serie">
      <div class="connection-copy"><span id="status-dot" class="dot"></span><div><strong id="connection-status" role="status">Desconectado</strong><p>9600 baudios · 8N1</p></div></div>
      <div class="buttons"><button id="connect">Conectar</button><button id="disconnect" class="secondary" disabled>Desconectar</button></div>
    </section>
    <p id="connection-message" class="message" role="status" aria-live="polite"></p>
    <div class="grid">
      <section class="card temperature-card" aria-labelledby="temperature-title">
        <h2 id="temperature-title">Temperatura actual</h2>
        <div class="reading"><span id="temperature">—</span><span class="unit">°C</span></div>
        <p id="sample-status" class="muted">Sin datos</p>
      </section>
      <section class="card pwm-card" aria-labelledby="pwm-title">
        <h2 id="pwm-title">PWM resistencias</h2>
        <div class="reading"><span id="heater-duty">—</span><span class="unit">%</span></div>
        <p id="pwm-status" class="muted" role="status">Sin datos</p>
      </section>
      <section class="card" aria-labelledby="reference-title">
        <h2 id="reference-title">Temperatura objetivo</h2>
        <form id="reference-form" novalidate>
          <label for="reference">Consigna <span>34–37 °C</span></label>
          <div class="input-row"><div class="input-wrap"><input id="reference" type="text" inputmode="decimal" placeholder="36.500" autocomplete="off" maxlength="6"><span>°C</span></div><button id="send" disabled>Enviar</button></div>
        </form>
        <p id="send-status" class="message" role="status" aria-live="polite"></p>
        <div class="confirmed"><span>Confirmada</span><strong id="confirmed-reference">—</strong><small id="reference-status"></small></div>
      </section>
    </div>
    <footer>Prototipo académico</footer>
  </main>
</body>
</html>
